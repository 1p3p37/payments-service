[project]
name = "payments-service"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "click>=8.5.0",
    "dishka>=1.10.1",
    "dishka-faststream>=0.7.0",
    "fastapi>=0.162.0",
    "faststream[cli,rabbit]>=0.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "DTZ", "PT"]
# кириллица в строках и комментариях
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S101: assert — штатный способ проверок в pytest;
# ASYNC109: хелперы опроса (wait_until, wait_message) принимают дедлайн, а не оборачивают await
"tests/**" = ["S101", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]

[[tool.mypy.overrides]]
# в тестах не требуем аннотаций у тестовых функций и фикстур; остальные проверки strict
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: testcontainers, нужен Docker",
    "e2e: требует поднятого docker compose",
]
